# Alembic configuration for the OSCE AI Marker backend.
#
# Run from this directory (fastapi_backend/), so that "app" is importable:
#
#   alembic upgrade head          # apply every pending migration
#   alembic current               # what this database is stamped at
#   alembic history --verbose     # the revision tree
#   alembic revision --autogenerate -m "add x"   # draft a new revision
#
# The database URL is deliberately NOT written here. env.py derives it from the
# application's own Settings (APP_DATABASE_URL / DATABASE_URL / the default
# SQLite file), so the CLI and the app can never disagree about which database
# they are talking to. Override for a one-off run with:
#
#   alembic -x db_url=postgresql+psycopg://... upgrade head

[alembic]
script_location = alembic
prepend_sys_path = .
# Splits prepend_sys_path/version_locations on the OS path separator. Replaces
# the older version_path_separator; without it Alembic warns and falls back to
# splitting on spaces, commas and colons — which mangles Windows drive letters.
path_separator = os

# Revision files are named 0001_..., 0002_... so that "ls versions/" reads in
# apply order; the revision identifiers themselves are the same numbers.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
