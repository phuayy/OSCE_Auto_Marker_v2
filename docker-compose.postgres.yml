name: osce-local-postgres

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-postgres_admin_dev_password}
      POSTGRES_DB: ${POSTGRES_ADMIN_DB:-postgres}
      OSCE_APP_DB: ${APP_POSTGRES_DB:-osce_marker}
      OSCE_APP_USER: ${APP_POSTGRES_USER:-osce_app}
      OSCE_APP_PASSWORD: ${APP_POSTGRES_PASSWORD:-osce_app_dev_password}
    ports:
      - "${APP_POSTGRES_HOST:-127.0.0.1}:${APP_POSTGRES_PORT:-5432}:5432"
    volumes:
      - osce_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${OSCE_APP_USER}\" -d \"$${OSCE_APP_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  osce_postgres_data:
