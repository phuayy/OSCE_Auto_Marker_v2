name: osce-hatchet

services:
  app-postgres:
    image: postgres:18
    command: postgres -c 'max_connections=100'
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${APP_POSTGRES_USER:-osce_app}
      POSTGRES_PASSWORD: ${APP_POSTGRES_PASSWORD:-osce_app}
      POSTGRES_DB: ${APP_POSTGRES_DB:-osce_marker}
    ports:
      - "${APP_POSTGRES_PORT:-5432}:5432"
    volumes:
      - app_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d ${APP_POSTGRES_DB:-osce_marker} -U ${APP_POSTGRES_USER:-osce_app}"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s

  hatchet-postgres:
    image: postgres:15.6
    command: postgres -c 'max_connections=200'
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${HATCHET_POSTGRES_USER:-hatchet}
      POSTGRES_PASSWORD: ${HATCHET_POSTGRES_PASSWORD:-hatchet}
      POSTGRES_DB: ${HATCHET_POSTGRES_DB:-hatchet}
    ports:
      - "${HATCHET_POSTGRES_PORT:-5433}:5432"
    volumes:
      - hatchet_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d ${HATCHET_POSTGRES_DB:-hatchet} -U ${HATCHET_POSTGRES_USER:-hatchet}"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s

  hatchet-lite:
    image: ghcr.io/hatchet-dev/hatchet/hatchet-lite:latest
    restart: unless-stopped
    depends_on:
      hatchet-postgres:
        condition: service_healthy
    ports:
      - "${HATCHET_SERVER_PORT:-8888}:8888"
      - "${HATCHET_GRPC_PORT:-7077}:7077"
    environment:
      DATABASE_URL: postgresql://${HATCHET_POSTGRES_USER:-hatchet}:${HATCHET_POSTGRES_PASSWORD:-hatchet}@hatchet-postgres:5432/${HATCHET_POSTGRES_DB:-hatchet}?sslmode=disable
      SERVER_AUTH_COOKIE_DOMAIN: localhost
      SERVER_AUTH_COOKIE_INSECURE: "t"
      SERVER_GRPC_BIND_ADDRESS: "0.0.0.0"
      SERVER_GRPC_INSECURE: "t"
      SERVER_GRPC_BROADCAST_ADDRESS: localhost:${HATCHET_GRPC_PORT:-7077}
      SERVER_GRPC_PORT: "${HATCHET_GRPC_PORT:-7077}"
      SERVER_URL: http://localhost:${HATCHET_SERVER_PORT:-8888}
      SERVER_AUTH_SET_EMAIL_VERIFIED: "t"
      SERVER_DEFAULT_ENGINE_VERSION: "V1"
      SERVER_INTERNAL_CLIENT_INTERNAL_GRPC_BROADCAST_ADDRESS: localhost:${HATCHET_GRPC_PORT:-7077}
    volumes:
      - hatchet_config:/config

volumes:
  app_postgres_data:
  hatchet_postgres_data:
  hatchet_config:
