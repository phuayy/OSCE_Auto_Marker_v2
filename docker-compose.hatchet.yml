name: osce-hatchet

# Trust model: everything in this file binds to 127.0.0.1 by default, so the
# app database, Hatchet's own database and the Hatchet control plane are not
# reachable from the network at all — only from this machine. That is also
# what makes SERVER_GRPC_INSECURE / SERVER_AUTH_COOKIE_INSECURE defensible as
# defaults: a plaintext gRPC/cookie channel that never leaves loopback is not
# a plaintext channel an attacker can observe.
#
# Running the Hatchet worker on a SEPARATE machine (a real distributed
# deployment, not "everything on one VM") changes that: you must
#   1. set the relevant *_HOST below to an interface other workers can
#      reach (or a private/VPN address — never 0.0.0.0 on a host with a
#      public interface), and
#   2. put a TLS-terminating proxy in front of the gRPC port and set
#      SERVER_GRPC_INSECURE=false (see https://docs.hatchet.run for the
#      engine's own TLS configuration) — gRPC traffic carries the
#      HATCHET_CLIENT_TOKEN this deployment's worker authenticates with, and
#      that must not cross a real network in the clear.
#
# APP_POSTGRES_PASSWORD and HATCHET_POSTGRES_PASSWORD have no default on
# purpose: a compose file that ships a working password is a password every
# clone of this repo shares. Set both in your .env before starting this stack
# (see .env.example) — compose refuses to start otherwise.

services:
  app-postgres:
    image: postgres:18.6
    command: postgres -c 'max_connections=100'
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${APP_POSTGRES_USER:-osce_app}
      POSTGRES_PASSWORD: ${APP_POSTGRES_PASSWORD:?Set APP_POSTGRES_PASSWORD in .env before starting this stack.}
      POSTGRES_DB: ${APP_POSTGRES_DB:-osce_marker}
    ports:
      - "${APP_POSTGRES_HOST:-127.0.0.1}:${APP_POSTGRES_PORT:-5432}:5432"
    volumes:
      - app_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d ${APP_POSTGRES_DB:-osce_marker} -U ${APP_POSTGRES_USER:-osce_app}"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s

  hatchet-postgres:
    image: postgres:15.14
    command: postgres -c 'max_connections=200'
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${HATCHET_POSTGRES_USER:-hatchet}
      POSTGRES_PASSWORD: ${HATCHET_POSTGRES_PASSWORD:?Set HATCHET_POSTGRES_PASSWORD in .env before starting this stack.}
      POSTGRES_DB: ${HATCHET_POSTGRES_DB:-hatchet}
    ports:
      - "${HATCHET_POSTGRES_HOST:-127.0.0.1}:${HATCHET_POSTGRES_PORT:-5433}:5432"
    volumes:
      - hatchet_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d ${HATCHET_POSTGRES_DB:-hatchet} -U ${HATCHET_POSTGRES_USER:-hatchet}"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s

  hatchet-lite:
    image: ghcr.io/hatchet-dev/hatchet/hatchet-lite:v0.98.8
    restart: unless-stopped
    depends_on:
      hatchet-postgres:
        condition: service_healthy
    ports:
      - "${HATCHET_SERVER_HOST:-127.0.0.1}:${HATCHET_SERVER_PORT:-8888}:8888"
      - "${HATCHET_GRPC_HOST:-127.0.0.1}:${HATCHET_GRPC_PORT:-7077}:7077"
    environment:
      DATABASE_URL: postgresql://${HATCHET_POSTGRES_USER:-hatchet}:${HATCHET_POSTGRES_PASSWORD:?Set HATCHET_POSTGRES_PASSWORD in .env before starting this stack.}@hatchet-postgres:5432/${HATCHET_POSTGRES_DB:-hatchet}?sslmode=disable
      SERVER_AUTH_COOKIE_DOMAIN: ${HATCHET_COOKIE_DOMAIN:-localhost}
      # Off only because every port above is loopback-only by default — see
      # the trust-model note at the top of this file before changing either
      # bind host without also flipping these off.
      SERVER_AUTH_COOKIE_INSECURE: ${HATCHET_COOKIE_INSECURE:-t}
      SERVER_GRPC_BIND_ADDRESS: "0.0.0.0"
      SERVER_GRPC_INSECURE: ${HATCHET_GRPC_INSECURE:-t}
      # A remote worker reaches this engine by whatever this advertises, not
      # by HATCHET_GRPC_HOST — pointing a remote worker at this stack
      # means changing this (and SERVER_URL below) to this host's real,
      # reachable address, on top of the bind-host and TLS changes described
      # in the trust-model note above.
      SERVER_GRPC_BROADCAST_ADDRESS: localhost:${HATCHET_GRPC_PORT:-7077}
      SERVER_GRPC_PORT: "${HATCHET_GRPC_PORT:-7077}"
      SERVER_URL: http://localhost:${HATCHET_SERVER_PORT:-8888}
      SERVER_AUTH_SET_EMAIL_VERIFIED: "t"
      SERVER_DEFAULT_ENGINE_VERSION: "V1"
      SERVER_INTERNAL_CLIENT_INTERNAL_GRPC_BROADCAST_ADDRESS: localhost:${HATCHET_GRPC_PORT:-7077}
    volumes:
      - hatchet_config:/config

volumes:
  app_postgres_data:
  hatchet_postgres_data:
  hatchet_config:
