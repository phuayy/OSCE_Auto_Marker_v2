version: 2

updates:
  # Frontend (Vite/React) dependencies declared in package.json.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # react-dom declares an exact peer on the matching react release, so a
      # PR that moves only one of the pair cannot even `npm ci` — Dependabot
      # used to open them separately and both failed CI with ERESOLVE. One PR
      # for the pair is the only shape that can pass.
      react:
        patterns: ["react", "react-dom"]
    ignore:
      # Tailwind 4 is a rewrite of the toolchain, not a version bump: the
      # PostCSS plugin moves to @tailwindcss/postcss, tailwind.config.js stops
      # being read without an @config directive, the default palette is
      # oklch() (tailwind.palette.js builds its tonal `rgb(var(--x) /
      # <alpha-value>)` variables from hex, and test/theme.test.mjs computes
      # contrast from hex), several utilities change meaning (ring width,
      # border colour, shadow/rounded scales), and the browser floor rises to
      # Safari 16.4 / Chrome 111 / Firefox 128. That is a planned migration on
      # its own branch with a browser pass over every screen, the bar
      # CLAUDE.md sets for UI changes — not something a Dependabot PR can
      # carry. Minor and patch releases of 3.x still come through.
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]

  # The workflow files themselves (actions/checkout, astral-sh/setup-uv, ...).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Python backend + AI pipeline, resolved via uv.lock.
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # torch/torchaudio/torchvision/whisperx/nemo_toolkit are pinned in
      # deliberate lockstep (see pyproject.toml's own comments beside each),
      # and peft rides with nemo_toolkit — NeMo's speechlm2 (the SALM path
      # Canary-Qwen loads through) imports it and builds the LoRA adapters
      # with it, the float32 upcast align_model_dtype corrects included:
      # torch's CUDA build, whisperx's model stack, and NeMo's speechlm2 path
      # were installed and verified together against a specific CUDA 12.8 /
      # cuDNN combination on the real GPU box this pipeline runs
      # transcription and scoring on. A Dependabot PR runs no GPU job, so it
      # cannot tell a genuinely compatible bump from one that only imports
      # cleanly — moving one of these six without the others (or without
      # re-testing on that machine) risks the same class of bug
      # pyproject.toml's own lockstep comments exist to prevent. Patch
      # releases still come through for security fixes; a major/minor bump
      # is silently skipped, not opened as a PR — Dependabot's `ignore`
      # entries suppress those updates outright, they do not surface them as
      # a comment anywhere — so any of these six moving still has to start
      # as a deliberate, manual bump, verified on the GPU box before it
      # merges.
      - dependency-name: "torch"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "torchaudio"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "torchvision"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "whisperx"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "nemo_toolkit"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "peft"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
