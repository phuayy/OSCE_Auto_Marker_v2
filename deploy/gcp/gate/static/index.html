<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OSCE AI Marker</title>
<style>
  :root {
    --bg: #f8fafc; --card: #ffffff; --ink: #0f172a; --muted: #475569; --line: #e2e8f0;
    --accent: #0891b2; --accent-ink: #ffffff; --good: #059669; --warn: #b45309; --bad: #be123c;
    --track: #e2e8f0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b1120; --card: #111827; --ink: #e2e8f0; --muted: #94a3b8; --line: #1f2937;
      --accent: #22d3ee; --accent-ink: #0b1120; --good: #34d399; --warn: #fbbf24; --bad: #fb7185;
      --track: #1f2937;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 480px; margin: 0 auto; padding: 48px 16px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 24px; }
  .status { display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 600; margin: 0 0 8px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.good { background: var(--good); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }
  .dot.busy { background: var(--accent); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  p.note { color: var(--muted); margin: 0 0 16px; }
  .error { color: var(--bad); }
  button, a.button { display: inline-block; border: 0; border-radius: 8px; padding: 10px 18px; font: inherit; font-weight: 600;
    background: var(--accent); color: var(--accent-ink); cursor: pointer; text-decoration: none; }
  button[disabled] { opacity: .6; cursor: default; }
  button.link { background: none; color: var(--muted); padding: 0; font-weight: 400; text-decoration: underline; }
  ol.steps { list-style: none; padding: 0; margin: 16px 0; }
  ol.steps li { display: flex; align-items: center; gap: 10px; padding: 5px 0; color: var(--muted); }
  ol.steps li.done { color: var(--ink); }
  ol.steps li.current { color: var(--ink); font-weight: 600; }
  .mark { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line); flex: none; display: grid; place-items: center; font-size: 11px; }
  li.done .mark { background: var(--good); border-color: var(--good); color: var(--card); }
  li.current .mark { border-color: var(--accent); border-top-color: transparent; animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .bar { height: 6px; background: var(--track); border-radius: 3px; overflow: hidden; margin: 8px 0 4px; }
  .bar > div { height: 100%; background: var(--accent); width: 0; transition: width .6s ease; }
  .timing { color: var(--muted); font-size: 13px; margin: 0; }
  .who { color: var(--muted); font-size: 13px; margin-top: 20px; }
  @media (prefers-reduced-motion: reduce) { .dot.busy, li.current .mark { animation: none; } .bar > div { transition: none; } }
</style>
</head>
<body>
<main>
  <h1 id="app-name">OSCE AI Marker</h1>
  <p class="sub">Start the marker here, then sign in to it as usual.</p>
  <div class="card" role="status" aria-live="polite">
    <p class="status"><span id="dot" class="dot"></span><span id="headline">Checking whether the marker is running…</span></p>
    <p id="note" class="note"></p>
    <ol id="steps" class="steps" hidden></ol>
    <div id="progress" hidden>
      <div class="bar"><div id="bar"></div></div>
      <p id="timing" class="timing"></p>
    </div>
    <div id="actions"></div>
    <p id="who" class="who" hidden></p>
  </div>
</main>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const OP_KEY = 'osce-gate-operation';
  let config = null;
  let status = null;
  let timer = null;
  let watchedStart = false;
  let message = '';

  const storage = {
    get() { try { return sessionStorage.getItem(OP_KEY) || ''; } catch { return ''; } },
    set(v) { try { v ? sessionStorage.setItem(OP_KEY, v) : sessionStorage.removeItem(OP_KEY); } catch {} },
  };

  async function api(path, options = {}) {
    const response = await fetch(path, { credentials: 'same-origin', ...options,
      headers: { 'Content-Type': 'application/json', ...(options.headers || {}) } });
    const body = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(body.detail || 'Something went wrong. Please try again.');
    return body;
  }

  function minutes(seconds) {
    if (seconds < 60) return `${Math.max(1, Math.round(seconds))} s`;
    const m = Math.floor(seconds / 60), s = Math.round(seconds % 60);
    return s ? `${m} min ${s} s` : `${m} min`;
  }

  function clock(seconds) {
    const m = Math.floor(seconds / 60), s = Math.floor(seconds % 60);
    return `${m}:${String(s).padStart(2, '0')}`;
  }

  function el(tag, props = {}, text = '') {
    const node = Object.assign(document.createElement(tag), props);
    if (text) node.textContent = text;
    return node;
  }

  function renderSignIn(actions) {
    const slot = el('div');
    actions.append(el('p', { className: 'note' }, 'Sign in with your Google account to start it.'), slot);
    const draw = () => {
      if (!window.google || !google.accounts || !config) { setTimeout(draw, 200); return; }
      google.accounts.id.initialize({ client_id: config.googleClientId, callback: onCredential });
      google.accounts.id.renderButton(slot, { theme: 'outline', size: 'large', text: 'signin_with' });
    };
    draw();
  }

  async function onCredential(response) {
    message = '';
    try {
      const body = await api('/api/session', { method: 'POST', body: JSON.stringify({ credential: response.credential }) });
      config.email = body.email;
    } catch (error) {
      message = error.message;
    }
    render();
  }

  async function start(button) {
    button.disabled = true;
    message = '';
    try {
      const body = await api('/api/start', { method: 'POST' });
      if (body.operation) storage.set(body.operation);
      watchedStart = true;
    } catch (error) {
      message = error.message;
    }
    await refresh();
  }

  async function signOut() {
    await api('/api/logout', { method: 'POST' }).catch(() => {});
    config.email = null;
    if (window.google && google.accounts) google.accounts.id.disableAutoSelect();
    render();
  }

  function render() {
    const s = status;
    const email = config && config.email;
    const actions = $('actions');
    actions.replaceChildren();
    $('steps').hidden = true;
    $('progress').hidden = true;
    $('note').className = 'note';
    $('note').textContent = '';

    if (!s) {
      $('dot').className = 'dot bad';
      $('headline').textContent = 'Could not reach Google Cloud';
      $('note').textContent = message || 'Checking again shortly.';
      return;
    }

    if (s.stage === 'ready') {
      $('dot').className = 'dot good';
      $('headline').textContent = 'The marker is running';
      if (watchedStart) {
        $('note').textContent = 'Opening the marker…';
        setTimeout(() => { window.location.href = s.appUrl; }, 1500);
      } else {
        $('note').textContent = 'Sign in to it with your marker account.';
      }
      actions.append(el('a', { className: 'button', href: s.appUrl }, 'Open the marker'));
    } else if (s.starting) {
      $('dot').className = 'dot busy';
      $('headline').textContent = 'Starting the marker';
      $('note').textContent = 'You can leave this page open; it moves on by itself.';
      const list = $('steps');
      list.replaceChildren(...s.steps.map((step) => {
        const li = el('li', { className: step.state });
        li.append(el('span', { className: 'mark', ariaHidden: 'true' }, step.state === 'done' ? '✓' : ''), el('span', {}, step.label));
        return li;
      }));
      list.hidden = false;
      if (s.elapsedSeconds != null) {
        const share = Math.min(0.95, s.elapsedSeconds / Math.max(1, s.estimateSeconds));
        $('bar').style.width = `${Math.round(share * 100)}%`;
        const left = s.estimateSeconds - s.elapsedSeconds;
        $('timing').textContent = left > 0
          ? `${clock(s.elapsedSeconds)} elapsed · about ${minutes(left)} left`
          : `${clock(s.elapsedSeconds)} elapsed · taking a little longer than usual`;
        $('progress').hidden = false;
      }
    } else if (s.stage === 'stopping') {
      $('dot').className = 'dot warn';
      $('headline').textContent = 'The marker is shutting down';
      $('note').textContent = s.label;
    } else if (s.stage === 'failed' || s.stage === 'unavailable') {
      $('dot').className = 'dot bad';
      $('headline').textContent = s.stage === 'failed' ? 'The marker could not start' : 'The machine is unavailable';
      $('note').className = 'note error';
      $('note').textContent = s.error || s.label;
      if (email && s.stage === 'failed') {
        const retry = el('button', { type: 'button' }, 'Try again');
        retry.onclick = () => { storage.set(''); start(retry); };
        actions.append(retry);
      }
    } else {
      $('dot').className = 'dot';
      $('headline').textContent = 'The marker is switched off';
      $('note').textContent = `It usually takes about ${minutes(s.estimateSeconds)} to start.`;
      if (email) {
        const go = el('button', { type: 'button' }, 'Start the marker');
        go.onclick = () => start(go);
        actions.append(go);
      } else if (config) {
        renderSignIn(actions);
      }
    }

    if (message) actions.append(el('p', { className: 'note error' }, message));
    const who = $('who');
    who.hidden = !email;
    if (email) {
      who.replaceChildren(document.createTextNode(`Signed in as ${email} · `));
      const out = el('button', { type: 'button', className: 'link' }, 'Sign out');
      out.onclick = signOut;
      who.append(out);
    }
  }

  async function refresh() {
    clearTimeout(timer);
    const operation = storage.get();
    try {
      status = await api(`/api/status${operation ? `?operation=${encodeURIComponent(operation)}` : ''}`);
      if (config) config.email = status.email;
      if (status.stage === 'ready' || status.stage === 'stopped' || status.stage === 'failed') storage.set('');
    } catch (error) {
      status = null;
      message = error.message;
    }
    render();
    const busy = status && (status.starting || status.stage === 'stopping');
    if (!document.hidden) timer = setTimeout(refresh, busy ? 3000 : 15000);
  }

  document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });

  api('/api/config').then((body) => {
    config = body;
    $('app-name').textContent = body.appName;
    document.title = body.appName;
    if (storage.get()) watchedStart = true;
    refresh();
  }).catch((error) => { message = error.message; render(); });
})();
</script>
</body>
</html>
